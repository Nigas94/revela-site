# Configuration Netlify du site Révéla (revela-motion.fr)
# Site statique : aucune commande de build, Netlify publie le dossier site/.
[build]
  publish = "site"

# Fonction qui envoie chaque demande de devis par e-mail (boîte OVH, réglages dans les variables d'environnement)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
